  # Class weights (imbalanced data countermeasure)
  class_weights:
    enabled: false        # Use weighted loss function
    weights: null         # Auto-computed from data if enabled
    auto_balance: true    # Automatically set weights inversely proportional to class frequency


signal_processing:
  # Analysis flags (control processing step activation)
  analysis_flags:
    doFFT: false              # FFT analysis execution flag
                              # true: Also use frequency domain features
                              # false: Use only time domain (recommended)
    doFilter: true            # Filtering execution flag
                              # true: Execute noise removal
                              # false: Use raw data
    doResample: true          # Resampling execution flag
                              # true: Unify sampling frequency
                              # false: Use original frequency

  # Filter settings (noise removal and signal quality improvement)
  filter:
    # Filter type
    type: "butterworth"       # Butterworth filter (standard)
                              # Options: "butterworth", "chebyshev", "elliptic"

    # Filter order (higher order = steeper characteristics)
    order: 4                  # 4th order filter (good balance)
                              # Low order: Gentle characteristics, small phase distortion
                              # High order: Steep characteristics, large phase distortion

    # Cutoff frequency settings
    cutoff:
      low: 0.1                # High-pass filter lower limit (Hz)
                              # For gravity/DC offset removal
      high: 5.0               # Low-pass filter upper limit (Hz)
                              # For high-frequency noise removal
                              # Human movement is typically 0.5-4Hz

    # Filtering direction
    forward_backward: true    # Bidirectional filtering
                              # true: No phase distortion, increased processing time
                              # false: Fast but phase delay occurs

  # FFT settings (frequency analysis, currently unused)
  fft:
    # FFT window size
    window_size: 256          # Power of 2 recommended (acceleration)
                              # Large: High frequency resolution, low time resolution
                              # Small: High time resolution, low frequency resolution

    # Window function
    window_type: "hanning"    # Hanning window (standard)
                              # Options: "hanning", "hamming", "blackman"

    # Overlap ratio
    overlap_ratio: 0.5        # 50% overlap
                              # High: Smooth analysis, increased computation
                              # Low: Fast, discontinuities occur

    delta_f: 0.1              # Frequency resolution (Hz)
                              # Analysis detail setting

  # Resampling settings (unify sampling frequency)
  resample:
    # Target sampling frequency
    target_frequency: 10      # 10Hz (sufficient for movement detection)
                              # High: Detailed waveform, increased computation
                              # Low: Fast processing, reduced information

    # Interpolation method
    interpolation: "linear"   # Linear interpolation (fast and stable)
                              # Options: "linear", "cubic", "nearest"

    # Anti-aliasing filter
    anti_aliasing: true       # Prevent aliasing
                              # true: High quality, increased processing time
                              # false: Fast, quality degradation risk
