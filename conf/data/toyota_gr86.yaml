# ==============================================
# Sensor Data Configuration
# ==============================================

# ==========================================
# 📁 Data Path Configuration
# ==========================================
# Unified dataset placement (using datasets/ directory)
paths:
  # Base directory (dedicated folder within datasets)
  base_dir: "./datasets/drivingdatasets"

  # Input data directory
  input_dir: "${paths.base_dir}/input"

  # Output directory (training results and model save location)
  output_dir: "${paths.base_dir}/output"

  # Data split directories
  train_dir: "${paths.input_dir}/train"      # Training data
  valid_dir: "${paths.input_dir}/valid"      # Validation data
  test_dir: "${paths.input_dir}/test"        # Test data
  prediction_dir: "${paths.input_dir}/prediction"  # Prediction data

# ==========================================
# 🔄 Resampling Configuration
# ==========================================
resampling:
  # Resampling enable flag
  enabled: true              # true: Resample to 10Hz
                            # false: Original sampling rate (~23Hz)

  # Target sampling frequency [Hz]
  target_frequency: 10.0    # 10Hz is sufficient for driving behavior evaluation
                            # 10Hz = Sample every 0.1 seconds

  # Original sampling frequency [Hz] (VIR data)
  original_frequency: 23.0  # VIR telemetry is approximately 23Hz

  # Enable anti-aliasing filter
  anti_aliasing: true       # Prevent aliasing during downsampling

  # Interpolation method
  interpolation_kind: "linear"  # Linear interpolation (fast and stable)
                               # Options: "linear", "cubic", "nearest"





# ==========================================
# 📊 Data Loading Parameters
# ==========================================
loading:
  # Batch size (balance between memory usage and learning stability)
  batch_size: ${training.batch_size}  # Reference from training settings

  # Number of dataloader workers (parallel data loading)
  num_workers: 0          # Windows: 2-4 recommended, Linux: 4-8 recommended
                          # More → Faster loading, increased memory consumption
                          # Less → Memory saving, IO wait occurs


  # Dataset persistence (memory efficiency)
  persistent_workers: false  # Maintain worker processes
                            # true → Fast, high memory consumption
                            # false → Memory saving, initialization overhead
  encoding: "utf-8"         # File encoding
                            # "utf-8" (standard), "utf-16", "latin1", etc.
  delimiter: ","           # CSV delimiter
  header_pos:
    common: 0               # Header row position for common format



# ==========================================
# 🎛️ Data Preprocessing
# ==========================================
preprocessing:
  # Feature selection
  features:
    - "pbrake_f"
    - "pbrake_r"
    - "Steering_Angle"
    - "accx_can"
    - "accy_can"
    - "ath"
    - "gear"
    - "nmot"
    - "speed"

  # Target label for prediction
  target_label: "vehicle_label"   # Vehicle identification label column

  # Normalization settings
  normalization:
    enabled: true         # Enable normalization
                          # true: Apply normalization
                          # false: Use raw data

    method: "minmax"      # Normalization method selection
                          # "minmax": Min-Max normalization [0, 1] range (with clipping)
                          # "zscore": Z-Score normalization mean=0, std=1 (±3σ clipping)

    # Parameters for Min-Max normalization
    min_max:
      # Features: pbrake_f, pbrake_r, Steering_Angle, accx_can, accy_can, ath, gear, nmot, speed
      # Values from EDA.ipynb actual data statistics (min and max columns)
      min: [0.0, 0.0, -467.057242, -2.305603, -3.637093, -16.022081, -1.150162, 0.0, 0.0]
      max: [180.869085, 182.249066, 466.393638, 2.481207, 1.924832, 112.747288, 6.083910, 7851.806179, 217.203306]

    # Z-Score normalization parameters
    zscore:
      # Set statistics calculated from training data here
      # Initially set to Null, will be automatically calculated during training
      mean: null  # Mean of entire training data
      std: null   # Standard deviation of entire training data
      clip_sigma: 3.0  # Clipping at ±N standard deviations (outlier countermeasure for production)




# ==========================================
# 🏷️ Label Configuration
# ==========================================
