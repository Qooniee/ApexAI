[project]
name = "apexai"
version = "0.1.0"
description = "ApexAI: The Integrated AutoML Platform for Race Strategy"
requires-python = ">=3.12"
dependencies = [
    # Core scientific libraries
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.5.0",
    "natsort>=8.0.0",

    # Data processing
    "polars>=1.0.0",
    "duckdb>=1.1.0",

    # Visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "streamlit>=1.51.0",

    # ML/DL frameworks and tools
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "transformers>=4.36.0",
    "shap>=0.46.0",

    # Experiment management and optimization
    "mlflow==3.2.0",
    "optuna>=3.6.0",
    "optuna-dashboard>=0.15.0",
    "sqlalchemy>=1.4,<2.1",
    "cmaes>=0.10.0",

    # Database
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",

    # Configuration management
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",

    # Storage and cloud
    "boto3>=1.40.0",

    # Utilities
    "pytz>=2024.0",
    "sqlparse>=0.5.0",
    "urllib3>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.0",

    # Interactive computing
    "streamlit>=1.39.0",
    "jupyterlab>=4.2.0",
    "ipywidgets>=8.1.0",
    "ipykernel>=6.29.0",
    "marimo==0.17.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "apexai/EDA\\.ipynb",
]

[tool.hatch.build.targets.wheel]
packages = ["apexai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
addopts = ["--strict-markers", "--cov=apexai"]

# Ruff configuration has been moved to ruff.toml for better organization
