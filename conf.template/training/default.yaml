# ==============================================
# Training Configuration
# ==============================================

# Optimizer Configuration
optimizer:
  name: "adam"
  lr: 0.001
  weight_decay: 0.0

# Loss Function
loss:
  name: "cross_entropy"

# Training Parameters
batch_size: 64
epochs: 5
max_batches: 50  # For quick testing, set to -1 for full training

# Validation
validation:
  enabled: true
  split_ratio: 0.2

# Checkpointing
checkpoint:
  save_best: true
  save_last: true
  monitor: "loss"
  mode: "min"

# Optuna Parameters for Optimization
optuna_params:
  lr:
    type: "float"
    low: 1e-5
    high: 1e-1
    log: true
  batch_size:
    type: "categorical"
    choices: [16, 32, 64, 128, 256]
